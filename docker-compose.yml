services:
  # ----------------------------------------------------------------------------
  # BierLog / Cervisium All-in-One Container
  # (Website + Express API + Eigen PostgreSQL Database in 1 container)
  # Bouwt rechtstreeks vanuit https://github.com/Mr-Braadworst/cervisium.git#main
  # ----------------------------------------------------------------------------
  bierlog:
    build:
      context: ${GITHUB_REPO:-https://github.com/Mr-Braadworst/cervisium.git#main}
      dockerfile: Dockerfile
    container_name: cervisium
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Bewaart de interne PostgreSQL database én sessie-sleutel veilig op schijf
      - bierlog_data:/data

volumes:
  bierlog_data:
