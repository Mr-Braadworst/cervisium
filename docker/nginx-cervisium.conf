# ==============================================================================
# Nginx Reverse Proxy Configuratie voor Cervisium (cervisium.nl)
# Voorkomt de Cloudflare redirect-loop ("cervisium.nl heeft je te vaak omgeleid")
#
# Installatie op je Ubuntu VPS:
# 1. sudo nano /etc/nginx/sites-available/cervisium
#    (plak onderstaande configuratie)
# 2. sudo ln -sf /etc/nginx/sites-available/cervisium /etc/nginx/sites-enabled/
# 3. sudo rm -f /etc/nginx/sites-enabled/default
# 4. sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# 1. Canonical Hostname Redirect: www.cervisium.nl ALTIJD naar https://cervisium.nl
# (Voorkomt gesplitste accounts, gescheiden localStorage en cookie-isolatie)
server {
    listen 80;
    listen [::]:80;
    server_name www.cervisium.nl;

    # Stuur direct om naar het hoofddomein met behoud van pad en parameters
    return 301 https://cervisium.nl$request_uri;
}

# 2. Hoofdserver cervisium.nl
server {
    listen 80;
    listen [::]:80;
    server_name cervisium.nl;

    # CRUCIAAL BIJ CLOUDFLARE:
    # GEEN 'return 301 https://...' plaatsen op poort 80 van het hoofddomein zelf!
    # Wanneer Cloudflare SSL op 'Flexible' staat, verbindt Cloudflare via HTTP (poort 80).
    # Als Nginx dan een 301 redirect terugstuurt naar https://, ontstaat er een
    # oneindige redirect-loop (ERR_TOO_MANY_REDIRECTS).
    #
    # In plaats daarvan sturen we het verkeer direct door naar Docker (poort 3000):

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets & HTTP/1.1 streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Originele client-headers (inclusief Cloudflare headers) doorsturen naar Express
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Max body size voor grote collecties en foto's
        client_max_body_size 150M;

        # Timeouts voor back-ups en checks
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
